<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="24" fill="#09090b"/>
  <rect x="5" y="5" width="90" height="90" rx="20" stroke="#22c55e" stroke-width="3" stroke-opacity="0.6"/>
  <!-- Football Turf Pitch -->
  <rect x="15" y="15" width="70" height="70" rx="6" stroke="#22c55e" stroke-width="3.5" fill="#14532d" fill-opacity="0.4"/>
  <!-- Center line -->
  <line x1="15" y1="50" x2="85" y2="50" stroke="#22c55e" stroke-width="3"/>
  <!-- Center circle -->
  <circle cx="50" cy="50" r="14" stroke="#22c55e" stroke-width="3"/>
  <circle cx="50" cy="50" r="3" fill="#22c55e"/>
  <!-- Penalty boxes -->
  <rect x="30" y="15" width="40" height="15" stroke="#22c55e" stroke-width="2.5" fill="none"/>
  <rect x="30" y="70" width="40" height="15" stroke="#22c55e" stroke-width="2.5" fill="none"/>
</svg>